<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Quest — Manual Edition</title><style>
:root {
  --ink: #34435a;
  --accent: #bd2338;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(135deg, #f5f1ff, #eefaff 50%, #fff4ed);
  color: var(--ink);
  font-family: "Trebuchet MS", Arial, sans-serif;
}
header {
  flex: none;
  text-align: center;
  padding: clamp(4px, 1.1dvh, 12px) 8px 4px;
}
h1 {
  margin: 0;
  font-size: clamp(21px, min(4vw, 5.5dvh), 46px);
  line-height: 1.1;
}
header p {
  margin: 3px 0 0;
  color: #59687b;
  font-size: clamp(11px, min(2.4vw, 2.4dvh), 17px);
}
.shell {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 1640px;
  margin: 0 auto;
  padding: clamp(4px, 1.1vmin, 12px);
}
.board {
  position: relative;
  container-type: size;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(7, minmax(0, 1fr));
  width: 100%;
  height: 100%;
  gap: clamp(2px, 0.8vmin, 8px);
  padding: clamp(3px, 0.8vmin, 9px);
  background: #fffdfb;
  border: clamp(3px, 0.85vmin, 9px) solid #dcd6ed;
  border-radius: clamp(10px, 2.5vmin, 25px);
  box-shadow: 0 10px 30px #9e9cba33;
}
.tile {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 40%) minmax(0, 1fr);
  justify-items: center;
  align-items: center;
  text-align: center;
  border-radius: clamp(5px, 1.2vmin, 12px);
  background: var(--tile);
  border: 1px solid #ffffffb5;
  padding: 1px clamp(1px, 0.35cqw, 5px);
  isolation: isolate;
}
.tile::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: #ffe875;
  box-shadow: 0 0 14px 5px #ffd94caa;
  opacity: 0;
  z-index: -1;
  transition: opacity 0.2s;
}
.tile.correct { outline: 2px solid #b68719; z-index: 4; }
.tile.correct::before { opacity: 1; }
.tile .answer {
  grid-row: 2;
  width: 100%;
  font-size: clamp(9px, min(2cqw, 4.5cqh), 32px);
  font-weight: 800;
  line-height: 1.06;
  overflow-wrap: anywhere;
}
.tile .index {
  grid-row: 1;
  justify-self: start;
  display: grid;
  place-items: center;
  width: clamp(14px, min(2.8cqw, 4.6cqh), 29px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: clamp(9px, min(1.55cqw, 2.8cqh), 16px);
  line-height: 1;
  font-weight: 800;
}
.tile.start { background: #d3e9da; }
.token {
  position: absolute;
  top: 0;
  right: 2px;
  height: clamp(17px, min(5.5cqh, 6.5cqw), 44px);
  aspect-ratio: 70 / 92;
  z-index: 3;
  pointer-events: none;
}
.token::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -2px -4px;
  border: 1px solid #148caa;
  border-radius: 50%;
  background: radial-gradient(ellipse, #fff 24%, #dcfaff 60%, #74dff1);
  box-shadow: 0 0 3px 1px #fff, 0 0 10px 3px #079bbdcc;
  animation: token-glow 1.4s ease-in-out infinite alternate;
}
.token svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(1px 2px 1px #42516a88);
}
@keyframes token-glow {
  to { box-shadow: 0 0 4px 2px #fff, 0 0 14px 5px #079bbdba; }
}
@media (prefers-reduced-motion: reduce) {
  .token::before { animation: none; }
}
.center {
  grid-area: 2 / 2 / 7 / 7;
  min-width: 0;
  min-height: 0;
  background: linear-gradient(150deg, #fefcff, #f6f8ff);
  border: 2px solid #e4dff0;
  border-radius: clamp(10px, 2.4vmin, 22px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
  align-items: center;
  justify-items: center;
  text-align: center;
  padding: clamp(4px, 2cqh, 18px) clamp(5px, 2cqw, 24px);
  gap: clamp(2px, 1cqh, 10px);
}
.eyebrow {
  font-weight: 800;
  color: #695989;
  letter-spacing: 0.07em;
  font-size: clamp(10px, min(2.1cqw, 2.5cqh), 16px);
}
.question {
  font-size: clamp(18px, min(5.1cqw, 7.25cqh), 60px);
  font-weight: 800;
  line-height: 1.1;
  max-width: 32ch;
  text-wrap: balance;
}
.controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(4px, 1cqw, 12px);
  width: min(100%, 560px);
}
button {
  border: 0;
  border-radius: clamp(6px, 1.5vmin, 14px);
  padding: clamp(3px, 1.15cqh, 12px) 4px;
  font: inherit;
  font-size: clamp(11px, min(2cqw, 2.8cqh), 21px);
  font-weight: 800;
  cursor: pointer;
  color: var(--ink);
  box-shadow: 0 3px 0 #00000012;
}
button:active { transform: translateY(2px); box-shadow: none; }
.space-instruction {
  background: #e4f2e9;
  border: 1px solid #c5e2d0;
  border-radius: clamp(6px, 1.5vmin, 14px);
  padding: clamp(3px, 1.15cqh, 11px) clamp(5px, 1.55cqw, 18px);
  font-weight: 800;
  font-size: clamp(11px, min(2.4cqw, 3.1cqh), 23px);
}
.space-instruction kbd {
  background: white;
  border: 1px solid #b9c9d0;
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 0.05em 0.35em;
  font: inherit;
}
#next { background: #cbdcf8; }
#reset { background: #f9e0b9; }
.speed-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(3px, 0.9cqw, 12px);
  width: 100%;
  font-weight: 800;
  font-size: clamp(10px, min(1.7cqw, 2.5cqh), 17px);
}
.speed-control input {
  flex: 0 1 240px;
  min-width: 32px;
  margin: 0;
  accent-color: #9d91d5;
  cursor: pointer;
}
.speed-control output {
  flex: 0 0 8ch;
  text-align: left;
  color: #68578e;
}
.status {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.2em;
  font-size: clamp(10px, min(2cqw, 2.7cqh), 19px);
  font-weight: 700;
  line-height: 1.1;
}
.confetti {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}
.confetti-piece {
  position: absolute;
  top: 3%;
  left: var(--start);
  width: clamp(4px, 0.65cqw, 9px);
  height: clamp(6px, 1cqw, 14px);
  border-radius: 2px;
  background: var(--color);
  opacity: 0;
  animation: confetti-fall 800ms ease-in var(--delay) both;
}
@keyframes confetti-fall {
  0% { opacity: 0; transform: rotate(0deg); }
  12% { opacity: 1; }
  70% { opacity: 1; }
  100% {
    opacity: 0;
    transform: translate(var(--drift), var(--fall)) rotate(var(--spin));
  }
}
@media (prefers-reduced-motion: reduce) {
  .confetti { display: none; }
}
@media (max-width: 540px) {
  .speed-control > span { display: none; }
  .board { height: min(100%, 148vw); }
}
@media (max-height: 420px) and (orientation: landscape) {
  .tile {
    grid-template: 1fr / auto minmax(0, 1fr);
    column-gap: 3px;
  }
  .tile .answer { grid-area: 1 / 2; }
  .tile.start .answer { grid-column: 1 / -1; }
  .tile:has(.token) { padding-right: clamp(14px, 5cqh, 26px); }
  .question { font-size: clamp(15px, min(4.4cqw, 8cqh), 32px); }
}
html,body{overflow:hidden} .tile .answer{overflow-wrap:normal;overflow-wrap:anywhere} .center{grid-template-rows:auto minmax(0,1fr) auto auto auto} button.tile{box-shadow:none;padding:1px 4px} button.tile:hover{outline:2px solid #9d91d5} button.tile.correct:hover{outline:2px solid #b68719} </style></head>

  <main class="shell">

        <div class="controls">
          <button type="button" id="next">Next →</button>
          <button type="button" id="reset">↺ Reset</button>
        </div>
        
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </section>
  </main>

for (let r = 5; r >= 0; r--) coordinates.push([r, 0]);
for (let c = 1; c <= 6; c++) coordinates.push([0, c]);
for (let r = 1; r <= 5; r++) coordinates.push([r, 6]);

const tiles = PROPERTIES.map((name, i) => {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.addEventListener('click', () => choose(i));
  tile.className = 'tile';
  tile.style.setProperty('--tile', colors[i % colors.length]);
  tile.style.gridRow = coordinates[i][0] + 1;
  tile.style.gridColumn = coordinates[i][1] + 1;

  {
    const index = document.createElement('span');
    index.className = 'index';
    index.textContent = i + 1;
    tile.appendChild(index);
  }

  const answer = document.createElement('span');
  answer.className = 'answer';
  answer.textContent = name;
  tile.appendChild(answer);
  board.appendChild(tile);
  return tile;
});

function place() {}

function celebrateCorrectAnswer() {
  applause.currentTime = 0;
  applause.play().catch(() => {
    // Audio may be unavailable. The tile and status still show the result.
  });

  for (let index = 0; index < 20; index++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.style.setProperty('--color', confettiColors[index % confettiColors.length]);
    piece.style.setProperty('--start', `${28 + index * 2.3}%`);
    piece.style.setProperty('--delay', `${Math.random() * 140}ms`);
    piece.style.setProperty('--drift', `${(Math.random() - 0.5) * 14}cqw`);
    piece.style.setProperty('--fall', `${27 + Math.random() * 19}cqh`);
    piece.style.setProperty('--spin', `${Math.random() * 960 - 480}deg`);
    confetti.appendChild(piece);
  }
}

function clearFeedback() {
  selected.clear();
  tiles.forEach(tile => tile.classList.remove('correct'));
  confetti.replaceChildren();
  applause.pause();
}

function status(message) {
  document.getElementById('status').textContent = message;
}

function stopMotion() {
  clearInterval(movementTimer);
  movementTimer = null;
}

function cancelAdvance() {
  clearTimeout(advanceTimer);
  advanceTimer = null;
}

function showQuestion() {
  const q = QUESTIONS[questionIndex];
  const el = document.getElementById('question');
  el.textContent = q.question;
  el.style.color = q.answers.length > 1 ? '#58158c' : '#1755b5';
  document.getElementById('answerMode').textContent = q.answers.length > 1 ? 'Multiple answers' : 'Single answer';
  document.getElementById('count').textContent =
    `Question ${questionIndex + 1} / ${QUESTIONS.length}`;
}

function step() {
  position = (position + 1) % tiles.length;
  place();
}

function startMotion() {
  movementTimer = setInterval(step, speedDelays[Number(speedSlider.value) - 1]);
}

function go() {
  if (advanceTimer !== null) return;
  status('Moving clockwise… press Space to stop!');
  startMotion();
}



function choose(i) {
  if (advanceTimer !== null) return;
  const name = PROPERTIES[i], answers = QUESTIONS[questionIndex].answers;
  if (!answers.includes(name)) { status('Not quite! Try again.'); return; }
  if (selected.has(name)) { status('Already selected. Find another answer.'); return; }
  selected.add(name); tiles[i].classList.add('correct');
  if (selected.size === answers.length) {
    status('✨ Correct!'); celebrateCorrectAnswer();
    advanceTimer = setTimeout(next, advanceDelay);
  } else { status(`Correct! ${selected.size} of ${answers.length} found. Keep going!`); }
}
function stop() { stopMotion(); choose(position); }

function next() {
  stopMotion();
  cancelAdvance();
  clearFeedback();
  questionIndex = (questionIndex + 1) % QUESTIONS.length;
  showQuestion();
  status('Click the correct answer(s).');
}

function reset() {
  stopMotion();
  cancelAdvance();
  position = 0;
  questionIndex = 0;
  clearFeedback();
  place();
  showQuestion();
  status('Click the correct answer(s).');
}


document.getElementById('next').addEventListener('click', next);
document.getElementById('reset').addEventListener('click', reset);
reset();
</script>
</body></html>
